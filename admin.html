
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin | Batalha da Alcatéia</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; padding: 20px;
      background: #090b10; color: #fff;
      font-family: Arial, sans-serif;
    }
    main { max-width: 650px; margin: auto; }
    header {
      text-align: center; padding: 22px 10px;
      background: linear-gradient(110deg,#063d86,#111,#970d20);
      border-radius: 12px; margin-bottom: 20px;
    }
    .card {
      background: #151923; padding: 18px;
      border: 1px solid #343b4b;
      border-radius: 12px; margin-bottom: 16px;
    }
    label { display:block; margin: 14px 0 6px; }
    input, textarea {
      width:100%; padding:12px; border-radius:7px;
      border:1px solid #444b5b; background:#0b0e15;
      color:#fff; font-size:16px;
    }
    button {
      padding:12px 16px; border:0; border-radius:7px;
      background:#087cff; color:#fff; font-weight:bold;
      margin-top:12px; cursor:pointer;
    }
    .danger { background:#ef233c; }
    .status { white-space:pre-wrap; overflow-wrap:anywhere; }
    #painel { display:none; }
    .hint { color:#bac4d5; font-size:14px; line-height:1.5; }
  </style>
</head>
<body>
<main>
  <header>
    <h1>🐺 BATALHA DA ALCATÉIA</h1>
    <p>Painel administrativo • Parintins - AM</p>
  </header>

  <section class="card" id="login">
    <h2>🔐 Acesso administrativo</h2>
    <p class="hint">Entre com o e-mail e a senha de um usuário autorizado no Supabase.</p>
    <form id="loginForm">
      <label for="email">E-mail</label>
      <input id="email" type="email" autocomplete="username" required>
      <label for="senha">Senha</label>
      <input id="senha" type="password" autocomplete="current-password" required>
      <button type="submit">Entrar</button>
    </form>
    <p id="mensagem" class="status" role="status"></p>
  </section>

  <section id="painel">
    <div class="card">
      <h2>Administração</h2>
      <p>Você entrou no painel.</p>
      <button class="danger" id="sair">Sair</button>
    </div>

    <section class="card">
      <h2>🎤 Cadastrar MC</h2>
      <form id="mcForm">
        <label for="mcNome">Nome artístico</label>
        <input id="mcNome" required>
        <label for="mcFoto">Link da foto (opcional)</label>
        <input id="mcFoto" type="url">
        <label for="mcInstagram">Instagram (opcional)</label>
        <input id="mcInstagram">
        <label for="mcBio">Biografia (opcional)</label>
        <textarea id="mcBio"></textarea>
        <button type="submit">Cadastrar MC</button>
      </form>
      <p id="mcStatus" class="status"></p>
    </section>

    <section class="card">
      <h2>📅 Cadastrar evento</h2>
      <form id="eventoForm">
        <label for="eventoNome">Nome do evento</label>
        <input id="eventoNome" required>
        <label for="eventoData">Data</label>
        <input id="eventoData" type="date" required>
        <label for="eventoHorario">Horário</label>
        <input id="eventoHorario" type="time" required>
        <label for="eventoLocal">Local</label>
        <input id="eventoLocal" required>
        <label for="eventoDescricao">Descrição (opcional)</label>
        <textarea id="eventoDescricao"></textarea>
        <button type="submit">Cadastrar evento</button>
      </form>
      <p id="eventoStatus" class="status"></p>
    </section>

    <section class="card">
      <h2>🏆 Ranking</h2>
      <button id="carregarRanking">Carregar ranking</button>
      <div id="rankingLista" class="status"></div>
    </section>
  </section>
</main>

<script type="module">
import "./admin.js";

const mensagem = document.getElementById("mensagem");
const login = document.getElementById("login");
const painel = document.getElementById("painel");

function mostrarSessao(session) {
  login.style.display = session ? "none" : "block";
  painel.style.display = session ? "block" : "none";
}

function erroTexto(error) {
  return error?.message || "Ocorreu um erro inesperado.";
}

document.getElementById("loginForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  mensagem.textContent = "Verificando acesso...";
  try {
    await window.AlcateiaAdmin.entrar(
      document.getElementById("email").value.trim(),
      document.getElementById("senha").value
    );
    const session = await window.AlcateiaAdmin.sessao();
    mostrarSessao(session);
    mensagem.textContent = "";
  } catch (error) {
    mensagem.textContent = "Não foi possível entrar: " + erroTexto(error);
  }
});

document.getElementById("sair").addEventListener("click", async () => {
  try {
    await window.AlcateiaAdmin.sair();
    mostrarSessao(null);
  } catch (error) {
    alert(erroTexto(error));
  }
});

document.getElementById("mcForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const status = document.getElementById("mcStatus");
  status.textContent = "Salvando...";
  try {
    await window.AlcateiaAdmin.cadastrarMC({
      nome: document.getElementById("mcNome").value.trim(),
      foto: document.getElementById("mcFoto").value.trim(),
      instagram: document.getElementById("mcInstagram").value.trim(),
      biografia: document.getElementById("mcBio").value.trim()
    });
    status.textContent = "MC cadastrado com sucesso!";
    e.target.reset();
  } catch (error) {
    status.textContent = "Erro ao cadastrar: " + erroTexto(error);
  }
});

document.getElementById("eventoForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const status = document.getElementById("eventoStatus");
  status.textContent = "Salvando...";
  try {
    await window.AlcateiaAdmin.cadastrarEvento({
      nome: document.getElementById("eventoNome").value.trim(),
      data: document.getElementById("eventoData").value,
      horario: document.getElementById("eventoHorario").value,
      local: document.getElementById("eventoLocal").value.trim(),
      descricao: document.getElementById("eventoDescricao").value.trim()
    });
    status.textContent = "Evento cadastrado com sucesso!";
    e.target.reset();
  } catch (error) {
    status.textContent = "Erro ao cadastrar: " + erroTexto(error);
  }
});

document.getElementById("carregarRanking").addEventListener("click", async () => {
  const lista = document.getElementById("rankingLista");
  lista.textContent = "Carregando...";
  try {
    const ranking = await window.AlcateiaAdmin.listarRanking();
    lista.textContent = ranking.length
      ? ranking.map((mc, i) =>
          `${i + 1}. ${mc.nome || mc.mc_id} — ${mc.pontos} pontos`
        ).join("\n")
      : "Nenhum registro de ranking encontrado.";
  } catch (error) {
    lista.textContent = "Erro ao carregar ranking: " + erroTexto(error);
  }
});

try {
  const session = await window.AlcateiaAdmin.sessao();
  mostrarSessao(session);
} catch (error) {
  mensagem.textContent = "Verifique a configuração: " + erroTexto(error);
}
</script>
</body>
</html>
